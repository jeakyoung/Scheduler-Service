spring:
  application:
    name: scheduler-service

  datasource:
    # LOCAL DEV ONLY fallback: if DB_URL is unset, boot against a local H2 file DB instead
    # of requiring a real SQL Server instance (Docker etc.) just to start the app. This
    # ONLY affects the engine's own meta DB (schedule_definition/target_db_config/
    # credential/admin_user + Quartz QRTZ_* tables) - the target business DB that
    # StoredProcedureInvoker calls into (target_db_config.jdbc_url) is completely unrelated
    # and is never H2; it's whatever real SQL Server an admin configures through the UI.
    # Always set DB_URL explicitly in any real deployment.
    url: ${DB_URL:jdbc:h2:file:./data/scheduler-meta;DATABASE_TO_LOWER=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    # driver-class-name intentionally omitted - Spring Boot detects the right JDBC driver
    # from the URL scheme (jdbc:h2: vs jdbc:sqlserver:) via DatabaseDriver.fromJdbcUrl().

  flyway:
    enabled: true
    # {vendor} resolves to "h2" or "sqlserver" (Spring Boot's DatabaseDriver id) based on
    # the active datasource URL - see db/migration/h2 vs db/migration/sqlserver. H2 needs
    # genuinely different DDL (IDENTITY generation, no NVARCHAR(MAX)/DATETIME2/T-SQL syntax,
    # no "GO" batch separators), not just a dialect tweak, so it gets its own migration set
    # rather than one script trying to parse under both engines.
    locations: classpath:db/migration/{vendor}

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never # schema is created by Flyway, not by Spring Boot

server:
  port: ${SERVER_PORT:8080}

scheduler-service:
  # Master key for AES-GCM encryption of target_db_config/credential secrets at rest.
  # Must be a base64-encoded 256-bit (32 byte) key. Generate e.g. with:
  #   openssl rand -base64 32
  master-encryption-key: ${MASTER_ENCRYPTION_KEY}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  jwt:
    # HMAC-SHA256 signing key for login tokens, base64-encoded 256-bit (32 byte) - separate
    # from master-encryption-key on purpose (signing and encryption keys shouldn't be shared).
    # Generate e.g. with: openssl rand -base64 32
    signing-key: ${JWT_SIGNING_KEY}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

app:
  cors:
    # Comma-separated list of allowed frontend origins (React SPA dev server / deployed domain).
    # e.g. http://localhost:5173,https://scheduler.example.com
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  auth:
    # LOCAL DEV ONLY - NEVER set this in production. When true, every /api/** endpoint is
    # open with no token required at all. Defaults to false (the secure, normal behavior).
    disabled: ${AUTH_DISABLED:false}

logging:
  level:
    com.scheduler: INFO
