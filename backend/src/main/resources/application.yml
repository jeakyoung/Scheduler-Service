spring:
  application:
    name: scheduler-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  flyway:
    enabled: true
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never # schema is created by Flyway (V2__quartz_tables.sql), not by Spring Boot
    properties:
      org:
        quartz:
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            # MSSQLDelegate (not the generic StdJDBCDelegate) - the official Quartz SQL
            # Server DDL script (V2__quartz_tables.sql) itself calls this out: SQL Server
            # doesn't support ANSI "SELECT ... FOR UPDATE" row locking, which StdJDBCDelegate
            # relies on and MSSQLDelegate works around.
            driverDelegateClass: org.quartz.impl.jdbcjobstore.MSSQLDelegate
            tablePrefix: QRTZ_
            isClustered: false
          scheduler:
            instanceName: SchedulerServiceQuartz

server:
  port: ${SERVER_PORT:8080}

scheduler-service:
  # Master key for AES-GCM encryption of target_db_config/credential secrets at rest.
  # Must be a base64-encoded 256-bit (32 byte) key. Generate e.g. with:
  #   openssl rand -base64 32
  master-encryption-key: ${MASTER_ENCRYPTION_KEY}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  jwt:
    # HMAC-SHA256 signing key for login tokens, base64-encoded 256-bit (32 byte) - separate
    # from master-encryption-key on purpose (signing and encryption keys shouldn't be shared).
    # Generate e.g. with: openssl rand -base64 32
    signing-key: ${JWT_SIGNING_KEY}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

app:
  cors:
    # Comma-separated list of allowed frontend origins (React SPA dev server / deployed domain).
    # e.g. http://localhost:5173,https://scheduler.example.com
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  auth:
    # LOCAL DEV ONLY - NEVER set this in production. When true, every /api/** endpoint is
    # open with no token required at all. Defaults to false (the secure, normal behavior).
    disabled: ${AUTH_DISABLED:false}

logging:
  level:
    com.scheduler: INFO
